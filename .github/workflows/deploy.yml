name: Deploy Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            
            echo "[1] Actualizando sistema base..."
            apt-get update
            apt-get install -y chromium-browser chromium-chromedriver
            
            echo "[2] Actualizando código backend..."
            cd /var/app/backend
            
            # Detener servicios antes de limpiar
            echo "Deteniendo servicios PM2..."
            pm2 stop api || true
            pm2 delete api || true
            
            # Limpiar archivos que puedan causar conflictos con git
            echo "Limpiando archivos temporales y entorno virtual anterior..."
            if [ -d "venv" ]; then
              echo "Eliminando entorno virtual anterior..."
              rm -rf venv
            fi
            
            # Limpiar otros archivos temporales
            rm -f *.log
            rm -rf __pycache__
            
            # Actualizar código limpiamente
            echo "Actualizando código desde repositorio..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            
            echo "[3] Configurando entorno Python..."
            # Crear un nuevo entorno virtual siempre después de la limpieza
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            echo "[4] Verificando puerto y preparando PM2..."
            # Verificar que el puerto esté libre
            if lsof -i:3001 > /dev/null 2>&1; then
              echo "Liberando puerto 3001..."
              lsof -ti:3001 | xargs kill -9 || true
              sleep 2
            fi
            
            echo "[5] Iniciando nueva instancia de la API..."
            pm2 start app.py --name api --interpreter /var/app/backend/venv/bin/python --instances 1
            
            echo "[6] Esperando que la API esté lista..."
            # Verificar que la API responda
            for i in {1..30}; do
              if curl -s http://localhost:3001/health > /dev/null 2>&1 || curl -s http://localhost:3001 > /dev/null 2>&1; then
                echo "API respondiendo correctamente"
                break
              fi
              echo "Esperando API... ($i/30)"
              sleep 2
            done
            
            pm2 save
            
            echo "[7] Recargando nginx..."
            nginx -t && systemctl reload nginx
            
            echo "[8] Creando señal de finalización para frontend..."
            echo "$(date)" > /tmp/backend-deploy-complete
